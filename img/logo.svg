<svg viewBox="0 0 480 120" xmlns="http://www.w3.org/2000/svg" width="480" height="120">

  <!-- Dark background -->
  <rect width="480" height="120" fill="#111111"/>

  <!-- Green square -->
  <rect x="14" y="10" width="96" height="96" fill="#1E4D35" rx="5"/>

  <!-- N inside square -->
  <g transform="translate(62, 58)">
    <rect x="-22" y="-30" width="12" height="60" fill="white"/>
    <rect x="10" y="-30" width="12" height="60" fill="white"/>
    <polygon points="-22,-30 -10,-30 22,30 10,30" fill="white"/>
  </g>

  <!-- NUPLANK -->
  <text x="128" y="72" font-family="'Arial Black', 'Arial Bold', Arial, sans-serif" font-size="52" font-weight="900" fill="white" letter-spacing="2">NUPLANK</text>

  <!-- FLOORING -->
  <text x="131" y="95" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#2a6648" letter-spacing="9">FLOORING</text>

</svg>
